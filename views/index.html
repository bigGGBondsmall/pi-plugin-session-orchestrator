<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v3" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';"
    />
    <title>Session Orchestrator</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <div class="orchestrator-app">
      <!-- 顶部控制条 -->
      <header class="app-header">
        <div class="header-main">
          <div class="title-cluster">
            <div class="icon-wrap" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
            </div>
            <div>
              <h1 class="app-title" id="txtAppTitle">会话编排器</h1>
              <span class="app-sub" id="txtAppSub">实时协同 · 派发 · 追问 · 监控</span>
            </div>
          </div>
          <div class="header-actions">
            <button type="button" class="btn btn-secondary btn-icon" id="btnRefresh" title="刷新列表">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
              </svg>
            </button>
            <button type="button" class="btn btn-secondary btn-auto-poll active" id="btnTogglePoll" title="自动轮询">
              <span class="pulse-dot"></span>
              <span id="txtPollStatus">轮询中(3s)</span>
            </button>
            <button type="button" class="btn btn-primary" id="btnOpenSpawn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span id="txtBtnSpawn">新建任务</span>
            </button>
          </div>
        </div>

        <!-- 统计面板 -->
        <div class="stats-row">
          <div class="stat-pill" data-filter="running">
            <span class="dot dot-running"></span>
            <span class="stat-label">进行中/排队</span>
            <span class="stat-num" id="statRunning">0</span>
          </div>
          <div class="stat-pill" data-filter="completed">
            <span class="dot dot-completed"></span>
            <span class="stat-label">已完成</span>
            <span class="stat-num" id="statCompleted">0</span>
          </div>
          <div class="stat-pill" data-filter="other">
            <span class="dot dot-idle"></span>
            <span class="stat-label">其它状态</span>
            <span class="stat-num" id="statIdle">0</span>
          </div>
          <div class="stat-pill" data-filter="all">
            <span class="dot dot-all"></span>
            <span class="stat-label">全部会话</span>
            <span class="stat-num" id="statTotal">0</span>
          </div>
        </div>
      </header>
      <div class="panel-notice" id="connectionNotice" role="status">正在连接宿主...</div>
      <div class="panel-notice error" id="errorNotice" role="alert" hidden></div>
      <div class="panel-notice" id="submissionNotice" role="status" hidden></div>

      <!-- 新建任务卡片 (折叠/展开) -->
      <section class="spawn-drawer" id="spawnDrawer" hidden>
        <div class="drawer-header">
          <h2 class="drawer-title" id="txtSpawnTitle">提交新子任务</h2>
          <button type="button" class="btn-close" id="btnCloseSpawn" aria-label="关闭">&times;</button>
        </div>
        <form id="spawnForm" class="spawn-form">
          <div class="form-group">
            <label for="inputTask" id="lblTask">任务内容 / 指令 (必填):</label>
            <textarea
              id="inputTask"
              rows="3"
              placeholder="例如：检查代码里的并发安全问题，列出需要修复的清单..."
              required maxlength="65536"
            ></textarea>
          </div>

          <div class="form-row">
            <div class="form-group flex-1">
              <label for="inputTitle" id="lblTitle">会话标题 (可选):</label>
              <input type="text" id="inputTitle" placeholder="如：代码安全审计员" maxlength="80" />
            </div>

            <div class="form-group flex-1">
              <label for="selectModel" id="lblModel">指定执行模型:</label>
              <select id="selectModel">
                <option value="">自动选择可委派模型</option>
              </select>
            </div>
          </div>

          <div class="form-row-check">
            <label class="checkbox-label">
              <input type="checkbox" id="chkNotify" />
              <span id="lblNotify">任务完成后推送通知到主会话</span>
            </label>
            <button type="submit" class="btn btn-primary" id="btnSubmitSpawn">
              <span>提交给主会话派发</span>
            </button>
          </div>
          <p class="form-help">任务交给当前主会话调用真实 SessionTask；提交回执不等于子会话已创建。主会话忙碌时请稍后提交。</p>
        </form>
      </section>

      <!-- 搜索与筛选工具栏 -->
      <div class="filter-bar">
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="inputSearch" placeholder="搜索标题或 Session ID..." />
        </div>
        <div class="filter-tabs" role="tablist">
          <button type="button" class="tab-pill active" data-tab="all">全部</button>
          <button type="button" class="tab-pill" data-tab="running">进行中</button>
          <button type="button" class="tab-pill" data-tab="completed">已完成</button>
          <button type="button" class="tab-pill" data-tab="other">其它</button>
        </div>
      </div>

      <!-- 会话与子任务列表 -->
      <main class="sessions-container" id="sessionsList">
        <div class="loading-state" id="loadingState">
          <div class="spinner"></div>
          <p id="txtLoading">正在同步会话编排状态...</p>
        </div>
        <div class="empty-state" id="emptyState" hidden>
          <p id="txtEmpty">暂无受编排的子会话。点击上方「新建任务」派发一个吧！</p>
        </div>
      </main>

      <!-- 详情弹窗 / Modal -->
      <div class="modal-backdrop" id="resultModal" hidden>
        <div class="modal-dialog">
          <div class="modal-header">
            <h3 class="modal-title" id="modalTitle">交付物 / 任务详情</h3>
            <button type="button" class="btn-close" id="btnCloseModal">&times;</button>
          </div>
          <div class="modal-body">
            <div class="meta-tags-row" id="modalMeta"></div>
            <div class="code-box">
              <pre id="modalContent"></pre>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="btnCopyResult">复制内容</button>
            <button type="button" class="btn btn-primary" id="btnCloseModalBtn">关闭</button>
          </div>
        </div>
      </div>
      <div class="modal-backdrop" id="actionModal" hidden>
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="actionTitle">
          <form id="actionForm">
            <div class="modal-header"><h3 class="modal-title" id="actionTitle"></h3></div>
            <div class="modal-body">
              <p id="actionDescription"></p>
              <label id="actionNoteLabel" for="actionNote">验收批注（可选）</label>
              <textarea id="actionNote" rows="3" maxlength="4096"></textarea>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" id="btnDismissAction">返回</button>
              <button type="submit" class="btn btn-primary" id="btnConfirmAction">确认</button>
            </div>
          </form>
        </div>
      </div>

      <!-- 浮层通知 -->
      <div class="toast-hub" id="toastHub"></div>
    </div>

    <script src="./panel.js"></script>
  </body>
</html>
